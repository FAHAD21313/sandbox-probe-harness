name: SandboxLabApp

options:
  deploymentTarget:
    iOS: "17.0"

packages:
  SandboxLabCore:
    path: ../SandboxLabCore

targets:
  SandboxLabApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.sandboxlab.harness
    sources:
      - path: SandboxLabApp
    dependencies:
      - package: SandboxLabCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
