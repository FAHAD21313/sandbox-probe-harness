name: CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  core:
    # setup-swift@v2 does not support Ubuntu 26.04 (what ubuntu-latest currently maps to).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SandboxLabCore
    steps:
      - uses: actions/checkout@v4
      # swift-tools-version 6.1 needs a Swift >= 6.1 toolchain; install it explicitly.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Pin Xcode so swift-tools 6.1 (Xcode >= 16.3) is always available.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      # No .pbxproj is committed (Linux host has no Xcode); generate it
      # deterministically from project.yml before building.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: SandboxLabApp
        run: xcodegen generate
      - name: Build iOS app
        # No signing credentials in CI: disable code signing for this build.
        run: xcodebuild -project SandboxLabApp/SandboxLabApp.xcodeproj -scheme SandboxLabApp -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build -quiet build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload SandboxLabApp.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SandboxLabApp.app Payload/
          zip -qry SandboxLabApp.ipa Payload
          test -s SandboxLabApp.ipa
      # Publishing only on push keeps pull_request (especially forks) from
      # mutating the release with a read-only token.
      - name: Ensure release 0.0.0 exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view 0.0.0 >/dev/null 2>&1 || \
            gh release create 0.0.0 --title '0.0.0' --notes 'Unsigned developer build (sideload only).'
      - name: Upload IPA (replace existing asset)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 0.0.0 SandboxLabApp.ipa --clobber
      - name: Verify release has exactly one IPA asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ipa_assets=$(gh release view 0.0.0 --json assets --jq '[.assets[].name | select(endswith(".ipa"))] | .[]')
          count=$(printf '%s\n' "$ipa_assets" | grep -c . || true)
          printf 'IPA assets:\n%s\n' "$ipa_assets"
          test "$count" -eq 1
          printf '%s\n' "$ipa_assets" | grep -qx 'SandboxLabApp.ipa'
